plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Simple Voice Chat"
		url = "https://maven.maxhenkel.de/repository/public"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			vmArgs "-Djava.net.preferIPv4Stack=true", "-Djava.net.preferIPv6Addresses=false"
		}
		server {
			vmArgs "-Djava.net.preferIPv4Stack=true", "-Djava.net.preferIPv6Addresses=false"
		}
	}

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Simple Voice Chat API
	modImplementation "de.maxhenkel.voicechat:voicechat-api:2.5.0"

	// Simple Voice Chat Modu (Test oyununda çalışması için)
	modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-1.21.1-2.6.21"

	// Vosk Offline Speech-to-Text kütüphanesi ve JNA (C++ köprüsü)
	implementation "com.alphacephei:vosk:0.3.45"
	include "com.alphacephei:vosk:0.3.45"
	implementation "net.java.dev.jna:jna:5.14.0"
	include "net.java.dev.jna:jna:5.14.0"

	// JLayer MP3 Player (TTS seslerini oynatmak için)
	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"

	// SQLite JDBC driver for persistent AI Companion memory
	implementation "org.xerial:sqlite-jdbc:3.46.0.0"
	include "org.xerial:sqlite-jdbc:3.46.0.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

task runScenarioTest(type: JavaExec) {
	group = 'verification'
	description = 'Runs the 50 Minecraft scenario AI Companion test and generates report'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.aicaddy.ai.test.CompanionScenarioTester'
}

task runFsmTest(type: JavaExec) {
	group = 'verification'
	description = 'Runs the formal FSM verification suite across Mood, Behavior, Phase, and Conversation FSMs'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.aicaddy.ai.test.FsmScenarioTester'
}

